[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anveshak-console"
version = "0.1.0"
description = "Anveshak Console: private multimodal reasoning with local memory and live retrieval."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Shashank Agnihotri" }
]
dependencies = [
  "accelerate",
  "aiofiles",
  "ddgs",
  "decord",
  "einops",
  "faiss-cpu",
  "fastapi",
  "gptqmodel>=5.7.0,<5.9",
  "huggingface-hub",
  "httpx",
  "librosa",
  "numpy",
  "openai-whisper",
  "openpyxl",
  "optimum",
  "orjson",
  "pillow",
  "psutil",
  "PyMuPDF",
  "python-docx",
  "python-multipart",
  "python-pptx",
  "qwen-vl-utils",
  "rich",
  "safetensors",
  "sentence-transformers",
  "sentencepiece",
  "soundfile",
  "timm",
  "torch",
  "torchvision",
  "tqdm",
  "trafilatura",
  "transformers==5.5.4",
  "uvicorn[standard]",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[project.scripts]
anveshak = "anveshak.cli:main"

[tool.setuptools.packages.find]
include = ["anveshak*"]

[tool.setuptools.package-data]
anveshak = ["static/*"]
