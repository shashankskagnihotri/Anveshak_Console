[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anveshak-console"
version = "0.1.0"
description = "Anveshak Console: private multimodal reasoning with local memory and live retrieval."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Sagnik + Codex" }
]
dependencies = []

[tool.setuptools.packages.find]
include = ["qwen_indexing*"]

[tool.setuptools.package-data]
qwen_indexing = ["static/*"]
